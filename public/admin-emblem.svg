<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pressing 90 Admin">
  <!-- Dark navy rounded-square background to read very differently
       from the gold-on-cream public emblem. -->
  <rect width="512" height="512" rx="96" ry="96" fill="#0a1a2e"/>
  <!-- Subtle gold ring inside the square for premium feel. -->
  <rect x="28" y="28" width="456" height="456" rx="78" ry="78"
        fill="none" stroke="#d4af37" stroke-width="3" opacity="0.55"/>
  <!-- Gear teeth around a central padlock — instantly says
       "admin / controls / locked area". -->
  <g transform="translate(256 256)">
    <!-- 12 small gold teeth radiating out -->
    <g fill="#d4af37">
      <rect x="-14" y="-200" width="28" height="38" rx="6"/>
      <g transform="rotate(30)"><rect x="-14" y="-200" width="28" height="38" rx="6"/></g>
      <g transform="rotate(60)"><rect x="-14" y="-200" width="28" height="38" rx="6"/></g>
      <g transform="rotate(90)"><rect x="-14" y="-200" width="28" height="38" rx="6"/></g>
      <g transform="rotate(120)"><rect x="-14" y="-200" width="28" height="38" rx="6"/></g>
      <g transform="rotate(150)"><rect x="-14" y="-200" width="28" height="38" rx="6"/></g>
      <g transform="rotate(180)"><rect x="-14" y="-200" width="28" height="38" rx="6"/></g>
      <g transform="rotate(210)"><rect x="-14" y="-200" width="28" height="38" rx="6"/></g>
      <g transform="rotate(240)"><rect x="-14" y="-200" width="28" height="38" rx="6"/></g>
      <g transform="rotate(270)"><rect x="-14" y="-200" width="28" height="38" rx="6"/></g>
      <g transform="rotate(300)"><rect x="-14" y="-200" width="28" height="38" rx="6"/></g>
      <g transform="rotate(330)"><rect x="-14" y="-200" width="28" height="38" rx="6"/></g>
    </g>
    <!-- Outer gold ring of the gear -->
    <circle cx="0" cy="0" r="160" fill="#d4af37"/>
    <!-- Inner navy disc to host the padlock -->
    <circle cx="0" cy="0" r="128" fill="#0a1a2e"/>
    <!-- Padlock shackle (rounded U at the top) -->
    <path d="M -42 -14 v -32 a 42 42 0 0 1 84 0 v 32"
          fill="none" stroke="#d4af37" stroke-width="18" stroke-linecap="round"/>
    <!-- Padlock body -->
    <rect x="-58" y="-12" width="116" height="92" rx="14" ry="14" fill="#d4af37"/>
    <!-- Keyhole on the body -->
    <circle cx="0" cy="22" r="11" fill="#0a1a2e"/>
    <rect x="-5" y="22" width="10" height="32" fill="#0a1a2e"/>
  </g>
  <!-- "ADMIN" wordmark under the gear, just like the FIFA wordmark on
       the public emblem — same visual rhythm, different word. -->
  <text x="256" y="478" text-anchor="middle"
        font-family="'Bricolage Grotesque', 'Inter', -apple-system, sans-serif"
        font-size="44" font-weight="800" letter-spacing="6"
        fill="#d4af37">ADMIN</text>
</svg>
