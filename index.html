<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a2540" />
    <link rel="icon" type="image/svg+xml" href="/p90-logo.svg" />
    <link rel="canonical" href="https://pressing90.live/" />

    <!-- PWA manifest + iOS "Add to Home Screen" support.
         iOS doesn't honor manifest.json fully, so we duplicate the
         critical metadata via apple-* tags so the saved icon + standalone
         launch behave like a native app. -->
    <link rel="manifest" href="/manifest.json" id="pwa-manifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pressing 90’" id="pwa-apple-title" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icon-180.png" id="pwa-apple-icon" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" id="pwa-apple-icon-180" />

    <!-- Admin PWA swap. iOS Safari reads the manifest + apple-* tags
         EAGERLY at page-parse time, before the React bundle finishes
         downloading. A useEffect inside AdminPanel.tsx swaps too late —
         tapping Share → Add to Home Screen would still capture the
         public manifest. So we swap synchronously, in the head, before
         any other script runs.
         Trigger on either the admin subdomain (admin.pressing90.live —
         the canonical install URL) OR the legacy /admin-panel-* path
         (kept for fallback bookmarks). -->
    <script>
      (function () {
        var host = location.hostname || ''
        var path = location.pathname || ''
        // Only swap on the admin subdomain AND under the /visca-barca slug.
        // Bare admin.pressing90.live renders a 404 in App.tsx and gets
        // no PWA swap — install attempts there fall back to the public
        // manifest, which is fine (they'd land on the public site anyway).
        // The legacy /admin-panel-1992 path is now a honeypot decoy and
        // intentionally does NOT trigger the admin manifest swap.
        var isAdminSubdomain = host.indexOf('admin.') === 0 && path.indexOf('/visca-barca') === 0
        if (!isAdminSubdomain) return
        var m = document.getElementById('pwa-manifest');         if (m) m.href = '/admin-manifest.json'
        var t = document.getElementById('pwa-apple-title');      if (t) t.content = 'P90 Admin'
        // iOS Safari's Add-to-Home-Screen reads apple-touch-icon as
        // PNG — SVG support is patchy across iOS versions and falls
        // back to the favicon (the WC26 emblem) when it can't decode.
        // Force PNG at the exact 180x180 canonical size + the generic
        // entry, both pointing at the cadenas/lock icon.
        var i = document.getElementById('pwa-apple-icon');       if (i) i.href = '/admin-icon-192.png'
        var i2 = document.getElementById('pwa-apple-icon-180');  if (i2) i2.href = '/admin-icon-180.png'
        var th = document.querySelector('meta[name="theme-color"]'); if (th) th.content = '#0a1a2e'
      })()
    </script>

    <!-- Google Search Console verification -->
    <meta name="google-site-verification" content="ooSl9AUG8WbW5zaA8Ezq6-JSe4jtxn_L4Ch4z2vhskY" />

    <!-- Warm the tournament endpoint in parallel with the JS bundle. By the
         time the React store calls api.tournament() this response is already
         sitting in the browser cache → near-zero blank gap on Groups. -->

      href="https://wc26-api.nameless-violet-5dc1.workers.dev/tournament" />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: SportsEvent (WC26) + Organization (Pressing 90′) + WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SportsEvent",
            "name": "FIFA World Cup 2026",
            "alternateName": ["World Cup 2026", "WC26", "Coupe du monde 2026"],
            "description": "First 48-nation FIFA World Cup, co-hosted by the United States, Mexico and Canada.",
            "startDate": "2026-06-11",
            "endDate": "2026-07-19",
            "sport": "Soccer",
            "eventStatus": "https://schema.org/EventScheduled",
            "eventAttendanceMode": "https://schema.org/MixedEventAttendanceMode",
            "location": [
              { "@type": "Country", "name": "United States" },
              { "@type": "Country", "name": "Mexico" },
              { "@type": "Country", "name": "Canada" }
            ],
            "organizer": { "@type": "SportsOrganization", "name": "FIFA" },
            "url": "https://pressing90.live/"
          },
          {
            "@type": "Organization",
            "name": "Pressing 90'",
            "alternateName": "Pressing 90",
            "url": "https://pressing90.live/",
            "logo": "https://pressing90.live/p90-logo.svg",
            "sameAs": ["https://mehdijabry.dev"],
            "description": "Football editorial — World Cup 2026 hub, live scores from every major competition, and a full-bracket prediction game."
          },
          {
            "@type": "WebSite",
            "name": "Pressing 90’",
            "url": "https://pressing90.live/",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://pressing90.live/?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
